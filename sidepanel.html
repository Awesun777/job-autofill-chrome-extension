<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Smart Job Autofill</title>
    <style>
      /* Same flat editorial system as the RomainTalk extension: warm cream,
         hairlines instead of shadows, navy/burgundy accents, uppercase micro
         labels. The old dark popup UI stays behind "Manage profiles". */
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --cream: #FFF8ED; --line: #E7DFD2; --line-soft: #EFE2CE;
        --navy: #173F6B; --burgundy: #A63D4A; --charcoal: #252321;
        --gray: #6F6A64; --blue: #DCECF8; --green: #2F9E44;
      }
      html, body { height: 100%; }
      body {
        font-family: "Nunito Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 14px; line-height: 1.5; color: var(--charcoal);
        background: var(--cream);
        display: flex; flex-direction: column;
      }

      header {
        padding: 16px 20px 12px;
        border-bottom: 1px solid var(--line);
        display: flex; align-items: center; gap: 10px;
        flex-shrink: 0;
      }
      header img { height: 24px; }
      header .title { font-size: 16px; font-weight: 800; }
      header .title .navy { color: var(--navy); }
      header .title .burgundy { color: var(--burgundy); }
      header .ver { margin-left: auto; font-size: 11px; color: var(--gray); font-variant-numeric: tabular-nums; }

      main { flex: 1; overflow-y: auto; }
      main::-webkit-scrollbar { width: 5px; }
      main::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }

      .label {
        font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase;
        color: var(--gray); padding: 18px 20px 8px;
      }

      /* ── Home: resume blocks ── */
      .hint { font-size: 12px; color: var(--gray); padding: 0 20px 10px; }
      .blocks { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
      .block {
        border: 1px solid var(--line); border-radius: 10px;
        padding: 12px 14px; cursor: pointer; background: transparent;
        display: flex; align-items: center; gap: 12px;
        transition: border-color .12s, background .12s;
        user-select: none;
      }
      .block:hover { border-color: var(--navy); }
      .block.selected { border-color: var(--navy); background: var(--blue); }
      .block-avatar {
        width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
        background: var(--navy); color: var(--cream);
        display: flex; align-items: center; justify-content: center;
        font-weight: 800; font-size: 14px;
      }
      .block-info { flex: 1; min-width: 0; }
      .block-name { font-weight: 800; font-size: 14px; color: var(--navy); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .block-meta { font-size: 11.5px; color: var(--gray); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .block-check { color: var(--navy); font-weight: 800; visibility: hidden; }
      .block.selected .block-check { visibility: visible; }

      /* ── Floating bottom menu: Fill · Profiles · Settings, centered ── */
      .dock {
        position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%);
        width: min(92%, 320px); z-index: 50;
        background: #FFFDF8;
        border: 1px solid var(--line); border-radius: 14px;
        box-shadow: 0 10px 28px -14px rgba(37, 35, 33, .35);
        padding: 6px; display: flex; gap: 4px;
      }
      .menu-btn {
        flex: 1; padding: 8px 4px; border: 0; border-radius: 10px;
        background: transparent; color: var(--gray);
        font: inherit; font-weight: 800; font-size: 13px; cursor: pointer;
      }
      .menu-btn:hover { color: var(--navy); }
      .menu-btn.active { background: var(--blue); color: var(--navy); }
      main { padding-bottom: 74px; }

      .actions { padding: 14px 20px 0; display: flex; flex-direction: column; gap: 8px; }

      .btn-primary {
        width: 100%; padding: 11px; border: 0; border-radius: 10px;
        background: var(--navy); color: var(--cream);
        font: inherit; font-weight: 800; font-size: 14px; cursor: pointer;
      }
      .btn-primary:hover { background: #1d4d82; }
      .btn-primary:disabled { background: var(--line); color: var(--gray); cursor: not-allowed; }
      .banner { padding: 9px 12px; border-radius: 8px; font-size: 12.5px; font-weight: 700; display: none; }
      .banner.ok { display: block; background: rgba(47,158,68,.1); color: var(--green); border: 1px solid rgba(47,158,68,.3); }
      .banner.err { display: block; background: rgba(166,61,74,.08); color: var(--burgundy); border: 1px solid rgba(166,61,74,.3); }

      .empty { padding: 40px 20px; text-align: center; color: var(--gray); font-size: 13px; }

      /* ── Detail: read-only resume, click to copy ── */
      .backrow {
        display: flex; align-items: center; gap: 8px;
        padding: 12px 20px; border-bottom: 1px solid var(--line);
        cursor: pointer; color: var(--gray); font-size: 13px; font-weight: 700;
        user-select: none;
      }
      .backrow:hover { color: var(--navy); }
      .detail-name { font-size: 18px; font-weight: 800; color: var(--navy); padding: 14px 20px 0; }
      .detail-hint { font-size: 12px; color: var(--gray); padding: 2px 20px 6px; }

      .row {
        padding: 8px 20px; cursor: pointer;
        border-top: 1px solid var(--line-soft);
      }
      .row:hover { background: var(--blue); }
      .row-label { font-size: 10.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--gray); }
      .row-value { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }

      .entry { border-top: 1px solid var(--line); }
      .entry-head { padding: 10px 20px 2px; font-weight: 800; font-size: 14px; color: var(--navy); }
      .entry-sub { padding: 0 20px 4px; font-size: 12px; color: var(--gray); }

      .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 20px 12px; }
      .chip {
        border: 1px solid var(--line); border-radius: 999px;
        padding: 3px 10px; font-size: 12px; cursor: pointer; user-select: none;
      }
      .chip:hover { border-color: var(--navy); background: var(--blue); }

      .foot { padding: 14px 20px 20px; }

      #toast {
        position: fixed; z-index: 9999; pointer-events: none;
        padding: 4px 10px; border-radius: 6px;
        background: var(--green); color: #fff;
        font-size: 12px; font-weight: 800;
        opacity: 0; transition: opacity .2s;
      }
      .flash { outline: 2px solid var(--green); outline-offset: -2px; }
    </style>
  </head>
  <body>
    <header>
      <img src="icons/icon48.png" alt="" />
      <div class="title"><span class="navy">Smart</span> <span class="burgundy">JobFill</span></div>
      <span class="ver" id="ver"></span>
    </header>
    <main id="main"></main>
    <nav class="dock" id="dock"></nav>
    <div id="toast">Copied ✓</div>
    <script src="sidepanel.js"></script>
  </body>
</html>
